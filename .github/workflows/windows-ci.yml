name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Install WiX Toolset
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          $toolPath = Join-Path $env:USERPROFILE ".dotnet\tools"
          $toolExe = Join-Path $toolPath "wix.exe"
          $toolPath | Out-File -FilePath $env:GITHUB_PATH -Append
          if (Test-Path $toolExe) {
            dotnet tool uninstall --global wix
          }
          dotnet tool install --global wix --version 6.0.2
          & $toolExe --version

      - name: Restore
        run: dotnet restore .\apps\windows\SpacePilot.sln

      - name: Build
        run: dotnet build .\apps\windows\SpacePilot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\apps\windows\tests\SpacePilot.Tests\SpacePilot.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=spacepilot-tests.trx" --results-directory .\artifacts\test-results

      - name: Package
        shell: pwsh
        run: .\scripts\windows\package-spacepilot.ps1 -Configuration Release -Runtime win-x64 -SkipSigning

      - name: Package installer zip
        shell: pwsh
        run: .\scripts\windows\package-installer.ps1 -SkipSigning

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spacepilot-win-x64
          path: artifacts/packages/*
          if-no-files-found: error
